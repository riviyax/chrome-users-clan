<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clan stats · Chrome Users</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090b10;--card:#12151d;--card2:#181c26;--line:#262c3a;--ink:#f2f4f8;--sub:#98a1b3;--red:#ea4335;--yellow:#fbbc04;--green:#34a853;--blue:#4285f4;--r:16px;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;letter-spacing:-.02em;margin:0;line-height:1.05}
a{color:inherit}:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(9,11,16,.78);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:14px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none}
.ring{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--red) 0 33%,var(--yellow) 0 66%,var(--green) 0);display:grid;place-items:center}
.ring i{width:11px;height:11px;border-radius:50%;background:var(--blue);border:2.5px solid var(--bg)}
.sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.live{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:p 2s infinite}.dot.err{background:var(--red);animation:none}
@keyframes p{70%{box-shadow:0 0 0 8px transparent}0%{box-shadow:0 0 0 0 var(--green)}}
.btn{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:700 14px Figtree;cursor:pointer;text-decoration:none;color:var(--ink);background:transparent}
.btn:hover{border-color:var(--sub)}.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
header.top{padding:34px 0 8px}header.top h1{font-size:clamp(32px,5vw,54px)}header.top p{color:var(--sub);margin:8px 0 0}
.grid{display:grid;gap:12px}
.cards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;border-top:3px solid var(--c)}
.card span{display:block;color:var(--sub);font-size:12.5px}.card b{font:800 28px 'Bricolage Grotesque',sans-serif}.card small{display:block;color:var(--sub);font-size:12px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{font-size:20px;margin-bottom:14px}
.bar{display:grid;grid-template-columns:54px 1fr 38px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bar u{display:block;height:12px;border-radius:6px;background:var(--c,var(--blue));text-decoration:none;min-width:4px}
.bar div{background:var(--card2);border-radius:6px;overflow:hidden}.bar em{font-style:normal;color:var(--sub);text-align:right}
.war{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;text-align:center;align-items:center}
.war h3{font-size:20px}.war .big{font:800 44px 'Bricolage Grotesque';line-height:1}.war small{display:block;color:var(--sub)}.vs{color:var(--red);font:800 20px 'Bricolage Grotesque'}
.lead{list-style:none;margin:0;padding:0;counter-reset:l}
.lead li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);counter-increment:l}
.lead li:last-child{border:0}.lead li::before{content:counter(l);width:24px;height:24px;border-radius:50%;background:var(--card2);color:var(--sub);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.lead li:nth-child(-n+3)::before{background:var(--yellow);color:#111}
.lead b{margin-left:auto;font-variant-numeric:tabular-nums}
.msg{padding:28px;text-align:center;color:var(--sub)}.msg.err{color:var(--red)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 12px;align-items:center}.tools h2{font-size:24px;margin-right:auto}
input,select{font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:60px}
table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;font-weight:500;color:var(--sub);font-size:12.5px;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}tbody tr:hover td{background:var(--card2)}
td.n{font-variant-numeric:tabular-nums}.pos{color:var(--green)}.neg{color:var(--red)}
.role{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--card2);color:var(--sub)}
.role.leader{background:var(--red);color:#fff}.role.coLeader{background:var(--yellow);color:#111}.role.admin{background:var(--green);color:#fff}
.th{font-weight:800;color:var(--blue)}
.plink{border:0;background:none;padding:0;font:700 14px Figtree;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--blue);text-underline-offset:3px}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--bg);color:var(--ink);padding:0;width:min(820px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.dh{position:sticky;top:0;display:flex;justify-content:flex-end;padding:12px 14px 0;background:var(--bg)}
.dh button{border:0;background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.pcard{padding:0 24px 6px}.pcard h2{font-size:32px}.pcard p{margin:2px 0 0;color:var(--sub)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px 24px 0}
.tile{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:10px 14px;background:var(--card)}
.tile span{display:block;color:var(--sub);font-size:12px}.tile b{font-size:21px}.tile small{display:block;color:var(--sub);font-size:12px}
.psec{padding:0 24px 26px}.psec h3{font-size:17px;margin:20px 0 10px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.unit{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);font-size:14px}
.uh{display:flex;justify-content:space-between;gap:8px}.uh i{font-style:normal;color:var(--sub)}
.pb{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.pb u{display:block;height:100%;background:var(--blue)}
.unit.max .pb u{background:var(--green)}
@media(max-width:600px){.war{grid-template-columns:1fr}.live span:last-child{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="index.html"><span class="ring"><i></i></span><span class="disp" id="nm">Chrome Users</span></a>
  <div class="sp">
    <div class="live"><span class="dot" id="dot"></span><span id="upd">Loading…</span></div>
    <button class="btn" id="refresh">Refresh</button>
    <a class="btn" href="index.html">Home</a>
    <a class="btn pri" id="deep" href="index.html#join">Join the clan</a>
  </div>
</div></nav>

<main class="wrap">
  <header class="top"><h1>Clan stats</h1><p id="sub">Live numbers straight from the game. Updates every 30 seconds.</p></header>
  <div class="grid cards" id="cards"><div class="msg" style="grid-column:1/-1">Loading clan data…</div></div>
  <div class="grid two">
    <div class="panel"><h2>Town Hall spread</h2><div id="thbars"></div></div>
    <div class="panel"><h2>Roles</h2><div id="rolebars"></div></div>
    <div class="panel"><h2>Current war</h2><div id="warbox"></div></div>
    <div class="panel"><h2>Top donors</h2><ol class="lead" id="donors"></ol></div>
    <div class="panel"><h2>Top trophies</h2><ol class="lead" id="tops"></ol></div>
  </div>
  <div class="tools">
    <h2>Member table</h2>
    <input id="q" type="search" placeholder="Search members" aria-label="Search members">
    <select id="sort" aria-label="Sort members">
      <option value="rank">Clan rank</option><option value="trophies">Trophies</option><option value="donations">Donated</option><option value="received">Received</option><option value="ratio">Donation ratio</option><option value="th">Town Hall</option><option value="level">XP level</option>
    </select>
  </div>
  <div class="scroll"><table><thead><tr><th>#</th><th>Player</th><th>Role</th><th>TH</th><th>XP</th><th>Trophies</th><th>Donated</th><th>Received</th><th>Balance</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>

<dialog id="dlg" aria-label="Player details"><div class="dh"><button id="close" aria-label="Close">×</button></div><div id="pc"></div></dialog>

<script>
const CFG = { tag: '2CYGVVU9Y' };
const REFRESH_MS = 30000;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n ?? 0).toLocaleString();
const ROLE = {leader:'Leader', coLeader:'Co-leader', admin:'Elder', member:'Member'};
const COLORS = ['--red','--yellow','--green','--blue'];
const parseCoc = t => t ? new Date(t.replace(/(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d).*/, '$1-$2-$3T$4:$5:$6Z')) : null;
$('#deep').href = 'https://link.clashofclans.com/en?action=OpenClanProfile&tag=' + CFG.tag;
$('#deep').target = '_blank'; $('#deep').rel = 'noopener';
let state = null, sort = 'rank', q = '';

async function load(){
  try{
    const r = await fetch('/api/clan'); const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Request failed');
    state = d; render();
    $('#dot').className = 'dot';
    $('#upd').textContent = 'Live · ' + new Date(d.updated || Date.now()).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){
    $('#dot').className = 'dot err'; $('#upd').textContent = 'Offline';
    if(!state) $('#cards').innerHTML = `<div class="msg err" style="grid-column:1/-1">Couldn't load clan data: ${esc(e.message)}.<br>Check COC_API_TOKEN and its allowed IP, then refresh.</div>`;
  }
}

const bars = (rows, color) => { const max = Math.max(1, ...rows.map(r => r[1]));
  return rows.map((r,i) => `<div class="bar" style="--c:var(${color || COLORS[i%4]})"><span>${esc(r[0])}</span><div><u style="width:${r[1]/max*100}%"></u></div><em>${r[1]}</em></div>`).join(''); };
const list = (arr, fn) => arr.map(m => `<li><span>${esc(m.name)}</span><b>${fn(m)}</b></li>`).join('');

function render(){
  const c = state.clan, ms = c.memberList;
  document.title = 'Clan stats · ' + c.name;
  $('#nm').textContent = c.name;
  const sum = k => ms.reduce((a,m) => a + (m[k]||0), 0);
  const don = sum('donations'), rec = sum('donationsReceived');
  const avgTh = ms.length ? (sum('townHallLevel')/ms.length).toFixed(1) : '–';
  const cards = [
    ['Clan level', c.clanLevel, ''], ['Members', c.members + '/50', (50-c.members) + ' open'],
    ['Clan points', fmt(c.clanPoints), 'Builder ' + fmt(c.clanBuilderBasePoints)],
    ['War record', `${c.warWins ?? 0}W ${c.warLosses ?? '–'}L ${c.warTies ?? 0}T`, ''],
    ['Win streak', c.warWinStreak ?? 0, ''], ['War league', c.warLeague?.name || '–', ''],
    ['Capital hall', c.clanCapital?.capitalHallLevel ?? '–', c.capitalLeague?.name || ''],
    ['Required trophies', fmt(c.requiredTrophies), c.type || ''],
    ['Total trophies', fmt(sum('trophies')), 'Avg ' + fmt(Math.round(sum('trophies')/Math.max(1,ms.length)))],
    ['Avg Town Hall', avgTh, ''],
    ['Troops donated', fmt(don), ''], ['Troops received', fmt(rec), 'Ratio ' + (rec ? (don/rec).toFixed(2) : '–')],
  ];
  $('#cards').innerHTML = cards.map((x,i)=>`<div class="card" style="--c:var(${COLORS[i%4]})"><span>${x[0]}</span><b${String(x[1]).length>10?' style="font-size:18px"':''}>${esc(x[1])}</b>${x[2]?`<small>${esc(x[2])}</small>`:''}</div>`).join('');
  $('#sub').textContent = [c.location?.name, c.warFrequency && c.warFrequency !== 'unknown' ? 'War frequency: ' + c.warFrequency : ''].filter(Boolean).join(' · ') || 'Live numbers straight from the game. Updates every 30 seconds.';
  const by = {}; ms.forEach(m => by[m.townHallLevel] = (by[m.townHallLevel]||0) + 1);
  $('#thbars').innerHTML = bars(Object.keys(by).map(Number).sort((a,b)=>b-a).map(l => ['TH' + l, by[l]])) || '<div class="msg">No data</div>';
  const rc = {}; ms.forEach(m => rc[m.role] = (rc[m.role]||0) + 1);
  $('#rolebars').innerHTML = bars(['leader','coLeader','admin','member'].filter(r => rc[r]).map(r => [ROLE[r], rc[r]]));
  $('#donors').innerHTML = list([...ms].sort((a,b)=>b.donations-a.donations).slice(0,5), m => fmt(m.donations));
  $('#tops').innerHTML = list([...ms].sort((a,b)=>b.trophies-a.trophies).slice(0,5), m => fmt(m.trophies));
  warBox(); rows();
}

function warBox(){
  const w = state.war, box = $('#warbox');
  if(!w) return box.innerHTML = '<div class="msg">War details unavailable. The war log may be private.</div>';
  if(w.state === 'notInWar') return box.innerHTML = '<div class="msg">Not in a war right now.</div>';
  const a = w.clan, b = w.opponent;
  const label = {preparation:'Preparation day', inWar:'Battle day', warEnded:'War ended'}[w.state] || w.state;
  const end = w.state === 'preparation' ? parseCoc(w.startTime) : parseCoc(w.endTime);
  const ms = end ? Math.max(0, end - Date.now()) : 0, h = Math.floor(ms/36e5), m = Math.floor(ms%36e5/6e4);
  const side = x => `<div><h3>${esc(x.name)}</h3><div class="big">${x.stars ?? 0}★</div><small>${(x.destructionPercentage ?? 0).toFixed(1)}% destroyed</small><small>${x.attacks ?? 0} attacks used</small></div>`;
  box.innerHTML = `<p style="text-align:center;color:var(--sub);margin:0 0 14px">${label}${w.state!=='warEnded' ? ` · ${h}h ${m}m ${w.state==='preparation'?'until battle':'left'}` : ''} · ${w.teamSize}v${w.teamSize}</p><div class="war">${side(a)}<div class="vs">VS</div>${side(b)}</div>`;
}

function rows(){
  if(!state) return;
  const ratio = m => m.donationsReceived ? m.donations/m.donationsReceived : m.donations;
  const key = {rank:(a,b)=>a.clanRank-b.clanRank, trophies:(a,b)=>b.trophies-a.trophies, donations:(a,b)=>b.donations-a.donations, received:(a,b)=>b.donationsReceived-a.donationsReceived, ratio:(a,b)=>ratio(b)-ratio(a), th:(a,b)=>b.townHallLevel-a.townHallLevel||b.trophies-a.trophies, level:(a,b)=>b.expLevel-a.expLevel}[sort];
  const l = state.clan.memberList.filter(m => m.name.toLowerCase().includes(q.toLowerCase())).sort(key);
  $('#rows').innerHTML = l.map(m => { const bal = m.donations - m.donationsReceived;
    return `<tr><td class="n">${m.clanRank}</td><td><button class="plink" data-tag="${esc(m.tag)}">${esc(m.name)}</button></td><td><span class="role ${esc(m.role)}">${ROLE[m.role]||esc(m.role)}</span></td><td class="th">${m.townHallLevel}</td><td class="n">${m.expLevel}</td><td class="n">${fmt(m.trophies)}</td><td class="n">${fmt(m.donations)}</td><td class="n">${fmt(m.donationsReceived)}</td><td class="n ${bal>=0?'pos':'neg'}">${bal>0?'+':''}${fmt(bal)}</td></tr>`; }).join('')
    || '<tr><td colspan="9" style="text-align:center;color:var(--sub)">No members match that search.</td></tr>';
}
$('#q').oninput = e => { q = e.target.value; rows(); };
$('#sort').onchange = e => { sort = e.target.value; rows(); };

/* player dialog */
const unit = (n,l,max) => `<div class="unit ${l>=max?'max':''}"><div class="uh"><span>${esc(n)}</span><b>${l}<i>/${max}</i></b></div><div class="pb"><u style="width:${Math.min(100,l/max*100)}%"></u></div></div>`;
const group = (t,arr,note) => arr?.length ? `<h3>${t}</h3>${note?`<p style="color:var(--sub);font-size:13px;margin:-4px 0 10px">${note}</p>`:''}<div class="units">${arr.map(u=>unit(u.name,u.level,u.maxLevel)).join('')}</div>` : '';
async function openPlayer(tag){
  $('#pc').innerHTML = '<div class="msg">Loading player…</div>';
  if(!$('#dlg').open) $('#dlg').showModal();
  try{
    const r = await fetch('/api/player?tag=' + encodeURIComponent(tag)); const p = await r.json();
    if(!r.ok) throw new Error(p.error || 'Request failed');
    showPlayer(p);
  }catch(e){ $('#pc').innerHTML = `<div class="msg err">Couldn't load this player: ${esc(e.message)}</div>`; }
}
function showPlayer(p){
  const home = a => (a||[]).filter(u => u.village === 'home');
  const near = (p.achievements||[]).filter(a => a.village==='home' && a.stars<3 && a.target>0).sort((a,b)=>b.value/b.target-a.value/a.target).slice(0,6);
  const league = p.leagueTier?.name || p.league?.name || 'Unranked';
  const tiles = [['Town Hall',p.townHallLevel,''],['Trophies',fmt(p.trophies),'Best '+fmt(p.bestTrophies)],['War stars',fmt(p.warStars),''],['Attacks won',fmt(p.attackWins),'Defenses won '+fmt(p.defenseWins)],['Donated',fmt(p.donations),'Received '+fmt(p.donationsReceived)],['Capital gold given',fmt(p.clanCapitalContributions),''],['Builder Hall '+(p.builderHallLevel ?? '–'),fmt(p.builderBaseTrophies),'Builder trophies']];
  $('#pc').innerHTML = `
    <section class="pcard"><h2>${esc(p.name)}</h2><p>${esc(p.tag)} · Level ${p.expLevel} · ${esc(league)}</p><p>${p.clan ? `${ROLE[p.role]||esc(p.role||'Member')} in ${esc(p.clan.name)}` : 'Not in a clan'}</p></section>
    <section class="tiles">${tiles.map((t,i)=>`<div class="tile" style="--c:var(${COLORS[i%4]})"><span>${t[0]}</span><b>${t[1]}</b>${t[2]?`<small>${t[2]}</small>`:''}</div>`).join('')}</section>
    <section class="psec">
      ${group('Heroes', home(p.heroes), 'Progress toward the max level for Town Hall ' + p.townHallLevel)}
      ${group('Hero equipment', p.heroEquipment)}
      ${group('Troops, siege and pets', home(p.troops))}
      ${group('Spells', home(p.spells))}
      ${near.length ? `<h3>Closest achievements</h3><div class="units">${near.map(a=>`<div class="unit"><div class="uh"><span>${esc(a.name)}</span><b style="color:var(--yellow)">${'★'.repeat(a.stars)}${'☆'.repeat(3-a.stars)}</b></div><div class="pb"><u style="width:${Math.min(100,a.value/a.target*100)}%"></u></div><small style="color:var(--sub)">${esc(a.info)}: ${fmt(a.value)} of ${fmt(a.target)}</small></div>`).join('')}</div>` : ''}
    </section>`;
}
$('#close').onclick = () => $('#dlg').close();
$('#dlg').addEventListener('click', e => { if(e.target === e.currentTarget) e.currentTarget.close(); });
document.addEventListener('click', e => { const t = e.target.closest('[data-tag]'); if(t) openPlayer(t.dataset.tag); });
$('#refresh').onclick = load;
load(); setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });
</script>
</body>
</html>
